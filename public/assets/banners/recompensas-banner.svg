<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="giftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e88e5"/>
      <stop offset="1" stop-color="#4ab24a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e88e5"/>
      <stop offset="1" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <!-- soft background blobs -->
  <circle cx="400" cy="400" r="320" fill="#EAF3DE"/>
  <circle cx="590" cy="220" r="110" fill="#E6F1FB"/>

  <!-- voucher ticket, peeking left -->
  <g transform="translate(115,300) rotate(-10)">
    <rect x="0" y="0" width="230" height="140" rx="16" fill="#4ab24a"/>
    <circle cx="0" cy="70" r="14" fill="#EAF3DE"/>
    <line x1="30" y1="10" x2="30" y2="130" stroke="#ffffff" stroke-width="3" stroke-dasharray="7 7" opacity="0.6"/>
    <rect x="55" y="35" width="60" height="10" rx="5" fill="#ffffff" opacity="0.9"/>
    <rect x="55" y="58" width="90" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="55" y="74" width="70" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
    <circle cx="180" cy="95" r="22" fill="#ffffff" opacity="0.15"/>
    <path d="M172 95 l6 6 12 -13" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- reward card, peeking right -->
  <g transform="translate(455,290) rotate(9)">
    <rect x="0" y="0" width="210" height="140" rx="16" fill="url(#cardGrad)"/>
    <circle cx="210" cy="60" r="16" fill="#EAF3DE"/>
    <path d="M35 45 l7 15 16 2 -12 12 3 16 -14 -8 -14 8 3 -16 -12 -12 16 -2 z" fill="#ffffff"/>
    <rect x="30" y="100" width="120" height="9" rx="4.5" fill="#ffffff" opacity="0.85"/>
    <rect x="30" y="116" width="80" height="7" rx="3.5" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- big gift box, centered -->
  <g transform="translate(280,340)">
    <rect x="10" y="90" width="220" height="150" rx="12" fill="#ffffff"/>
    <rect x="10" y="90" width="220" height="150" rx="12" fill="url(#giftGrad)" opacity="0.94"/>
    <rect x="0" y="55" width="240" height="48" rx="10" fill="url(#giftGrad)"/>
    <rect x="103" y="55" width="34" height="185" fill="#ffffff" opacity="0.85"/>
    <path d="M120 55 c-34 -4 -58 -22 -58 -42 c0 -16 14 -26 28 -26 c22 0 30 30 30 68z" fill="url(#giftGrad)" stroke="#ffffff" stroke-width="3"/>
    <path d="M120 55 c34 -4 58 -22 58 -42 c0 -16 -14 -26 -28 -26 c-22 0 -30 30 -30 68z" fill="url(#giftGrad)" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- coin stack, front -->
  <g transform="translate(230,545)">
    <ellipse cx="0" cy="34" rx="46" ry="15" fill="#4ab24a"/>
    <ellipse cx="0" cy="20" rx="46" ry="15" fill="#8cc63f"/>
    <ellipse cx="0" cy="6" rx="46" ry="15" fill="#4ab24a"/>
    <ellipse cx="0" cy="-8" rx="46" ry="15" fill="#8cc63f"/>
    <path d="M-8 -18 l5 10 11 1 -8 8 2 11 -10 -5 -10 5 2 -11 -8 -8 11 -1 z" fill="#ffffff"/>
  </g>

  <!-- sparkles -->
  <path d="M610 470 l6 13 13 6 -13 6 -6 13 -6 -13 -13 -6 13 -6 z" fill="#8cc63f"/>
  <path d="M560 210 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" fill="#1e88e5"/>
  <path d="M140 220 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" fill="#4ab24a"/>
</svg>
